<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>💗</title>

    <style>

        /* ===== CONFIGURAÇÃO DA TELA ===== */

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #ffeef5;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }


        /* ===== PRIMEIRA PÁGINA ===== */

        #pagina1 {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            box-sizing: border-box;
            padding: 20px;
        }

        #pagina1 h1 {
            color: #d85b86;
            font-size: 28px;
            margin: 0 0 30px 0;
        }

        #pagina1 .botoes {
            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* ===== BOTÕES ===== */

        button {
            border: none;
            border-radius: 20px;

            padding: 12px 25px;
            margin: 10px;

            font-size: 18px;
            cursor: pointer;
        }

        #sim {
            background: #e98aad;
            color: white;
        }

        #nao {
            background: white;
            color: #d85b86;

            position: absolute;
        }


        /* ===== SEGUNDA PÁGINA ===== */

        #pagina2 {
            display: none;

            width: 100vw;
            height: 100vh;

            box-sizing: border-box;
            padding: 30px;

            text-align: center;

            background: #fff0f6;

            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #pagina2 h1 {
            color: #d85b86;
            font-size: 38px;
            margin: 15px;
        }

        #pagina2 h2 {
            color: #d85b86;
            font-size: 22px;

            max-width: 500px;
        }

        #pagina2 p {
            color: #9d5270;
            font-size: 18px;

            max-width: 500px;
        }

        .decoracao {
            font-size: 25px;

            margin: 15px 0;

            letter-spacing: 8px;
        }

        #carta {
            background: #e98aad;
            color: white;

            font-size: 19px;

            padding: 14px 28px;
        }

    </style>
</head>


<body>


    <!-- ===== PRIMEIRA PÁGINA ===== -->

    <div id="pagina1">

        <h1>
            Quer continuar namorando comigo? 💗
        </h1>

        <div class="botoes">

            <button id="sim" onclick="sim()">
                SIM 💕
            </button>

            <button id="nao">
                NÃO 😈
            </button>

        </div>

    </div>



    <!-- ===== SEGUNDA PÁGINA ===== -->

    <div id="pagina2">

        <div class="decoracao">
            🌷 ✨ 🌸 ⚪ ⭐ 🌼 ⚪ ✨ 🌷
        </div>

        <h1>
            EBAAAAAA !!! 🎉🐭
        </h1>

        <h2>
            ESTOU FELIZ QUE ESCOLHEU ESSA OPÇÃO 💗
        </h2>

        <p>
            Eu estava torcendo para você escolher essa... 👀
        </p>

        <p>
            Como se você tivesse outra escolha, né? KKKKK 😈💗
        </p>

        <div class="decoracao">
            ⭐ 🌸 ⚪ 🌷 🐭 🌷 ⚪ 🌸 ⭐
        </div>

        <button id="carta" onclick="abrirCarta()">
            💌 Ler minha carta
        </button>

    </div>



    <!-- ===== JAVASCRIPT ===== -->

    <script>

        window.addEventListener("DOMContentLoaded", function () {

            const botaoNao = document.getElementById("nao");
            const botaoSim = document.getElementById("sim");


            /* Faz o NÃO começar ao lado do SIM */

            function posicionarNao() {

                const simRect = botaoSim.getBoundingClientRect();

                botaoNao.style.left =
                    (simRect.right + 20) + "px";

                botaoNao.style.top =
                    simRect.top + "px";
            }


            /* Faz o NÃO fugir */

            function fugir() {

                const largura =
                    window.innerWidth -
                    botaoNao.offsetWidth -
                    20;

                const altura =
                    window.innerHeight -
                    botaoNao.offsetHeight -
                    20;

                const x =
                    Math.random() *
                    Math.max(largura, 0);

                const y =
                    Math.random() *
                    Math.max(altura, 0);

                botaoNao.style.left = x + "px";

                botaoNao.style.top = y + "px";
            }


            /* Posição inicial */

            posicionarNao();


            /* Celular / tablet */

            botaoNao.addEventListener(
                "touchstart",
                function (event) {

                    event.preventDefault();

                    fugir();

                }
            );


            /* Computador */

            botaoNao.addEventListener(
                "mouseenter",
                fugir
            );


            botaoNao.addEventListener(
                "click",
                fugir
            );


            /* Reposiciona se a tela mudar */

            window.addEventListener(
                "resize",
                posicionarNao
            );

        });



        /* ===== BOTÃO SIM ===== */

        function sim() {

            document.getElementById("pagina1").style.display = "none";

            document.getElementById("pagina2").style.display = "flex";

        }



        /* ===== BOTÃO DA CARTA ===== */

        function abrirCarta() {

            window.open(
                "https://docs.google.com/document/d/1n9I46CDcpNzwglLc3rp5oa1JlNw1Ey8xT39_pPlCnZY/edit?usp=drivesdk",
                "_blank"
            );

        }

    </script>

</body>

</html>
